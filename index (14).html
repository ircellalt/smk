 function showModal(html){modalReturnFocus=document.activeElement?.id;modal=html;render();document.getElementById('close-modal')?.focus();}
 function download(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
 async function run(){const s=SJ.store.get();if(!s.files.length){toast('Load or import a file before running the smoke test.');return;}SJ.routes.reset();toast('Running the current files in a sandboxed frame.');const result=await SJ.fixer.run(s.files,s.routes);SJ.store.set({run:result});modalReturnFocus=document.activeElement?.id;modal=`<h2>Smoke test · ${result.status}</h2><p>${U.esc(result.mode||'')}</p><p>${U.esc(result.reason||'')}</p><p>${result.counts.passed} of ${result.counts.total} checks passed · ${result.ran.length} file completion(s) received · ${result.elapsedMs} ms measured</p>${result.inlined?.length?`<p>Inlined: ${U.esc(result.inlined.join(' · '))}</p>`:''}${result.missing?.length?`<p class="chip warn">${result.missing.length} embedded file reference(s) could not load in the harness: ${U.esc(result.missing.join(' · '))}</p>`:''}<h3>Checks</h3><pre>${U.esc(result.checks.map(x=>`${x.ok?'✓':'✗'} ${x.label} — ${x.detail}`).join('\n'))}</pre>${result.parseErrors?.length?`<h3>Parser errors</h3><pre>${U.esc(result.parseErrors.map(x=>`${x.file}: ${x.name}: ${x.message}`).join('\n'))}</pre>`:''}<h3>Runner messages</h3><pre>${U.esc(result.log.map(x=>{const d=x.data||{};if(x.type==='error')return `${d.file||''} ${d.name||'Error'}: ${d.message||''}${d.stack?`\n${d.stack}`:''}`;if(x.type==='console')return `console.${d.level}: ${d.message}`;if(x.type==='wire')return `${d.method} ${d.path} → ${d.status} · ${d.route} · ${d.bytes} constructed bytes${d.error?` · ${d.error}`:''}`;if(x.type==='pending')return `pending route calls: ${d.pending}`;return `${d.file||d.method||''} ${x.type}`;}).join('\n')||'No completion message received.')}</pre>`;render();document.getElementById('close-modal')?.focus();}
 function showMap(){showModal(`<h2>Keyboard map</h2><pre>⌘K palette · j/k next/prev finding · Enter apply · ⌫ dismiss · Space run smoke test · ⌘Z/⇧⌘Z undo/redo · ⌘S export · / filter · 1–3 load samples · ? map · Esc close</pre>`);}
 document.addEventListener('keydown',e=>{const s=SJ.store.get(),mac=e.metaKey||e.ctrlKey;if(e.key==='Escape'&&modal){const target=modalReturnFocus;modal=null;render();document.getElementById(target)?.focus();return;}if(mac&&e.key.toLowerCase()==='z'){if(e.target.matches('input,textarea,select'))return;e.preventDefault();modal=null;e.shiftKey?SJ.store.redo():SJ.store.undo();return;}if(mac&&e.key.toLowerCase()==='s'){e.preventDefault();download(JSON.stringify({files:s.files,routes:s.routes},null,2),'smoke-project.json','application/json');return;}if(e.key==='?'&&!e.target.matches('input,textarea,select')){showMap();return;}if(e.key===' '&&!e.target.matches('input,textarea,select,button,[role=button]')){e.preventDefault();run();return;}if(e.key==='/'&&!e.target.matches('input,textarea,select')){e.preventDefault();document.getElementById('filter')?.focus();return;}if(['j','k','Home','End','PageDown','PageUp','ArrowDown','ArrowUp'].includes(e.key)&&!e.target.matches('input,textarea,select')){const rows=visibleEntries();if(rows.length){e.preventDefault();const at=Math.max(0,rows.findIndex(x=>x.index===s.selected)),step=e.key==='j'||e.key==='PageDown'||e.key==='ArrowDown'?1:e.key==='k'||e.key==='PageUp'||e.key==='ArrowUp'?-1:0,pos=e.key==='Home'?0:e.key==='End'?rows.length-1:Math.max(0,Math.min(rows.length-1,at+step*(e.key.startsWith('Page')?8:1))),n=rows[pos].index;SJ.store.set({selected:n});document.querySelector(`[data-finding="${n}"]`)?.scrollIntoView({block:'nearest'});}}if((e.key==='Backspace'||e.key==='Delete')&&!e.target.matches('input,textarea,select,button,[role=button]')){const f=SJ.store.get().findings[SJ.store.get().selected];if(f){dismissed.add(f.id);SJ.store.set({selected:visibleEntries()[0]?.index??0});}}if(e.key==='Enter'&&!e.target.matches('input,textarea,select,button')&&e.target.closest('.findings')){const s=SJ.store.get(),rows=visibleEntries(),target=rows.find(x=>x.index===s.selected)?.index??rows[0]?.index; if(target!==undefined)applyFinding(s.findings[target]);}if(mac&&e.key.toLowerCase()==='k')showModal(`<h2>Command palette</h2><p>Choose an action from the bench.</p><div class="detail-actions"><button id="p-run">Run smoke test</button><button id="p-scan">Scan</button><button id="p-sample">Checkout sample</button></div>`);if(['1','2','3'].includes(e.key)&&!e.target.matches('input,textarea,select'))useSample(+e.key-1);});
 async function init(){const restored=await SJ.store.restore();SJ.routes.install();SJ.routes.configure(()=>render());SJ.store.subscribe(()=>render());if(restored){const s=SJ.store.get();SJ.store.set({findings:SJ.rules.scan(s.files)});}else{SJ.store.set({routes:SJ.routes.getRoutes(),notice:'Fresh workspace · seeded API wire sample loaded from this file.'});SJ.store.importFiles(samples[2].files.map(x=>({...x})));}render();document.addEventListener('click',e=>{if(e.target.id==='p-run'){modal=null;run();}if(e.target.id==='p-scan'){modal=null;scan();}if(e.target.id==='p-sample'){modal=null;useSample(0);}});}
 window.SJ={...(window.SJ||{}),ui:{init}};
})();
/* module: 85-boot.js */
(function(){
 function start(){SJ.ui.init().catch(error=>{const app=document.getElementById('app');app.textContent=`The bench could not start because ${error.name}: ${error.message}. Reload the file after checking the saved project.`;});}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();</script></body></html>
